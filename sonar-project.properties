# =====================================================================
# SonarQube Configuration for SynapseEdu (aws-sonarqube)
# =====================================================================

# Identification
sonar.projectKey=aws-sonarqube
sonar.projectName=SynapseEdu - Neural Educational Network
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=client/src,server

# Encoding
sonar.sourceEncoding=UTF-8

# Files and directories to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  client/dist/**,\
  client/public/**,\
  server/data/**,\
  **/*.test.js,\
  **/*.spec.js

# Language specifics
sonar.javascript.environments=browser,nodejs
