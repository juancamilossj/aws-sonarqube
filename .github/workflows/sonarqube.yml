name: SonarQube Analysis & Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code (fetch-depth: 0 is required for Sonar analysis)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Validate Secrets
      - name: Validate SonarQube Configuration
        run: |
          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "❌ ERROR: El secreto SONAR_HOST_URL está vacío o no ha sido creado en GitHub Secrets."
            echo "👉 Ve a Settings > Secrets and variables > Actions y agrega SONAR_HOST_URL con el protocolo (ej: http://TU-IP-EC2:9000 o https://sonarcloud.io)"
            exit 1
          fi
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "❌ ERROR: El secreto SONAR_TOKEN no está configurado en GitHub Secrets."
            exit 1
          fi

      # Step 3: Set up Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 4: Install dependencies for root, client, and server
      - name: Install Dependencies
        run: |
          npm install
          cd server && npm install && cd ..
          cd client && npm install && cd ..

      # Step 5: Build React Client
      - name: Build React Client
        run: |
          cd client
          npm run build
          cd ..

      # Step 6: Official SonarQube Scan Action
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # Step 7: Verify SonarQube Quality Gate
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
